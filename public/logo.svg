<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Animated flash-bolt Afritop mark — self-contained so it also animates
       as the browser-tab favicon (Chrome/Edge animate SVG favicons). -->
  <style>
    .bolt {
      filter: drop-shadow(0 0 3px rgba(212, 255, 63, 0.35));
    }
    .ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: flash 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .flash {
      animation: glow 6s ease-in-out infinite;
    }
    @keyframes flash {
      0%, 94.5%, 100% { opacity: 0; transform: scale(0.7); }
      95.5% { opacity: 0.9; transform: scale(0.95); }
      97.5% { opacity: 0; transform: scale(1.55); }
    }
    @keyframes glow {
      0%, 95%, 100% { opacity: 0; }
      96% { opacity: 1; }
      97.5% { opacity: 0.25; }
      99% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring, .flash { animation: none; opacity: 0; }
      .bolt { filter: none; }
    }
  </style>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2"/>
  <circle class="ring" cx="24" cy="24" r="17" stroke="#d4ff3f" stroke-width="2.5" opacity="0"/>
  <path class="bolt" d="M26 4 6 28h18l-2 16 20-24h-18l2-16z" fill="#d4ff3f"/>
  <path class="flash" d="M26 4 6 28h18l-2 16 20-24h-18l2-16z" fill="#ffffff" opacity="0"/>
</svg>
